name: Image

# Builds the driver image and publishes it to ghcr.io. A pull request builds
# the image and pushes nothing, so a broken Dockerfile fails before it merges.
# A push to main publishes `main`, `sha-<commit>`, and
# `<YYYYMMDD>-<HHMMSS>-<run_number>-<short_sha>`, the tag a Flux ImagePolicy
# sorts on its timestamp. It then publishes deploy/kubernetes/v1.20 as the
# OCI artifact synology-csi-deploy under that same tag, with newTag set to
# it, so one tag pins the manifests and the image together. A git tag
# publishes the tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tag
        id: build
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-${{ github.run_number }}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The tests run before the build, so a failing test never publishes.
      - name: Test
        run: go test . ./pkg/...

      # The runtime stage runs apk for each platform, which needs an emulator
      # for arm64. The builder stage cross-compiles and does not.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The gha layer cache in docker-bake.hcl needs the runner's cache
      # token, which only actions can read. This step copies it into the
      # environment of the run steps below.
      - name: Expose the runner's cache token
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-bake.hcl holds the platforms, the tags, and the OCI labels and
      # annotations, so this build and `docker buildx bake` on a laptop make
      # the same image. SOURCE_DATE_EPOCH makes the image config's creation
      # time the commit time, which leaves the layer cache alone.
      - name: Build and push
        env:
          BUILD: ${{ steps.build.outputs.tag }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            VERSION="pr-$PR_NUMBER" docker buildx bake synology-csi
            exit 0
          fi
          SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          REVISION="$(git rev-parse HEAD)"
          VERSION="$REF_NAME"
          CREATED="$(git log -1 --format=%cI)"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          SHA_TAG="sha-$(git rev-parse --short=7 HEAD)"
          BUILD_TAG=""
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            BUILD_TAG="$BUILD"
          fi
          export SOURCE REVISION VERSION CREATED SOURCE_DATE_EPOCH SHA_TAG BUILD_TAG
          docker buildx bake synology-csi --push --sbom=true

      - name: Set up Flux
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
        with:
          version: 2.9.5

      # The deploy artifact goes after the image, because a cluster follows
      # the artifact, and it must never name an image that is not pushed yet.
      - name: Publish the deploy artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD: ${{ steps.build.outputs.tag }}
        run: |
          yq -i '(.images[] | select(.name == "synology/synology-csi")).newTag = strenv(BUILD)' deploy/kubernetes/v1.20/kustomization.yaml
          # The same repository and commit keys as the image, with the
          # artifact's own title and description. The licenses, url, and
          # vendor values repeat docker-bake.hcl.
          flux push artifact "oci://ghcr.io/${{ github.repository_owner }}/synology-csi-deploy:$BUILD" \
            --path deploy/kubernetes/v1.20 \
            --source "${{ github.server_url }}/${{ github.repository }}" \
            --revision "$BUILD@sha1:${{ github.sha }}" \
            --annotations "org.opencontainers.image.created=$(git log -1 --format=%cI)" \
            --annotations "org.opencontainers.image.title=synology-csi-deploy" \
            --annotations "org.opencontainers.image.description=A kustomize base that deploys the Synology CSI driver." \
            --annotations "org.opencontainers.image.documentation=https://github.com/chrisguidry/synology-csi#readme" \
            --annotations "org.opencontainers.image.url=https://github.com/chrisguidry/synology-csi" \
            --annotations "org.opencontainers.image.licenses=Apache-2.0" \
            --annotations "org.opencontainers.image.vendor=Chris Guidry" \
            --annotations "org.opencontainers.image.version=$BUILD"
