name: Image

# Builds the driver image and publishes it to ghcr.io. A pull request builds
# the image and pushes nothing, so a broken Dockerfile fails before it merges.
# A push to main publishes `main`, `sha-<commit>`, and
# `<YYYYMMDD>-<HHMMSS>-<run_number>-<short_sha>`, the tag a Flux ImagePolicy
# sorts on its timestamp. It then publishes deploy/kubernetes/v1.20 as the
# OCI artifact synology-csi-deploy under that same tag, with newTag set to
# it, so one tag pins the manifests and the image together. A git tag
# publishes the tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tag
        id: build
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-${{ github.run_number }}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The tests run before the build, so a failing test never publishes.
      - name: Test
        run: go test . ./pkg/...

      # The runtime stage runs apk for each platform, which needs an emulator
      # for arm64. The builder stage cross-compiles and does not.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/synology-csi
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ steps.build.outputs.tag }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Flux
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
        with:
          version: 2.9.5

      # The deploy artifact goes after the image, because a cluster follows
      # the artifact, and it must never name an image that is not pushed yet.
      - name: Publish the deploy artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD: ${{ steps.build.outputs.tag }}
        run: |
          yq -i '(.images[] | select(.name == "synology/synology-csi")).newTag = strenv(BUILD)' deploy/kubernetes/v1.20/kustomization.yaml
          flux push artifact "oci://ghcr.io/${{ github.repository_owner }}/synology-csi-deploy:$BUILD" \
            --path deploy/kubernetes/v1.20 \
            --source "${{ github.server_url }}/${{ github.repository }}" \
            --revision "$BUILD@sha1:${{ github.sha }}"
